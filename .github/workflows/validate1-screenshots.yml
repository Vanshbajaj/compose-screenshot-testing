name: Android CI – Validate Screenshot Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run screenshot validation
        id: validate_screenshots
        run: |
          echo "Java version:" && java -version
          ./gradlew --stop || true
          ./gradlew :app:validateDebugScreenshotTest --stacktrace
        continue-on-error: false

      - name: Upload screenshot test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshotTest-results
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            build/reports/problems/problems-report.html

      - name: Fail if diffs found
        if: always()
        run: |
          DIFF_DIR="app/build/outputs/screenshotTest-results/preview/debug/diffs"
          if [ -d "$DIFF_DIR" ] && [ "$(ls -A "$DIFF_DIR")" ]; then
            echo "::error file=screenshot_test::Screenshot diffs found in $DIFF_DIR"
            exit 1
          else
            echo "✅ No screenshot diffs found."
          fi
