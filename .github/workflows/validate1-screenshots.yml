name: Android CI - Validate Screenshot Test

on: [push, pull_request]

jobs:
  validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin_jdk/17*/x64
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Start Emulator and Run Screenshot Validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          profile: 'Nexus 6'
          emulator-options: '-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect'
          script: |
            set -e
            echo "Using Java version:"
            java -version
            ./gradlew --stop || true
            ./gradlew :app:validateDebugScreenshotTest --no-daemon --stacktrace --info || true
            echo "Listing screenshot diffs (if any):"
            ls -la app/build/outputs/screenshotTest-results/preview/debug/diffs || true

      - name: Upload Screenshot Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshotTest-results
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            build/reports/problems/problems-report.html

      - name: Kill Emulator (Best-Effort)
        if: always()
        run: adb -s emulator-5554 emu kill || true
