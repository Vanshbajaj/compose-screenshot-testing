name: Android CI - validate screenshots (force Java 17)

on: [push, pull_request, workflow_dispatch]

jobs:
  validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Expose Java info
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Ensure gradlew executable
        run: chmod +x ./gradlew

      # Optional: cache Gradle and wrapper, keyed by libs.versions.toml
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      # Optional: clear stale Kotlin cache to avoid metadata mismatch
      - name: Remove Kotlin stdlib cache
        run: rm -rf ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin || true

      - name: Start emulator and run validateDebugScreenshotTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          profile: Nexus 6
          force-avd-creation: true
          arch: x86_64
          emulator-options: -wipe-data -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            set -eu
            echo "Using JAVA_HOME=$JAVA_HOME"

            ./gradlew --no-daemon --stop || true

            # Run the screenshot validation in a single line to avoid backslash problems.
            # Force Gradle worker JVMs to use Java 17 and refresh dependencies.
            ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:validateDebugScreenshotTest --no-daemon --info --stacktrace --refresh-dependencies || true

            echo "-- Listing outputs for artifact collection --"
            ls -la app/build/outputs/screenshotTest-results || true
            ls -la app/build/test-results/validateDebugScreenshotTest || true
            if [ -f app/build/outputs/screenshotTest-results/preview/debug/results.json ]; then
              echo "==== results.json ===="
              cat app/build/outputs/screenshotTest-results/preview/debug/results.json || true
            fi


      - name: Upload screenshot test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshotTest-results
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            build/reports/problems/problems-report.html

      - name: Terminate emulator (best-effort)
        if: always()
        run: adb -s emulator-5554 emu kill || true
