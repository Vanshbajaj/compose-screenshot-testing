name: Validate (with screenshots)

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Enable KVM (for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Cache AVD
        uses: actions/cache@v3
        id: avd-cache
        with:
          path: |
            ~/.android/avd
            ~/.android/adbkey*
          key: avd-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            avd-cache-${{ runner.os }}-

      - name: Create Android Virtual Device and run tests + screenshots
        uses: reactivecircus/android-emulator-runner@v2
        id: testing
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -wipe-data -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            set -euo pipefail

            # 1) Optional: unit tests
            ./gradlew testDebugUnitTest --no-daemon --stacktrace

            # 2) Render preview screenshots (preview-side)
            ./gradlew :app:debugPreviewScreenshotRender --no-daemon --stacktrace

            # 3) Build & run instrumentation tests on emulator (captures screenshots)
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

            # 4) Validate screenshots — run non-fatal so artifacts always upload
            set +e
            ./gradlew :app:validateDebugScreenshotTest --no-daemon --stacktrace
            VALIDATE_RC=$?
            echo "validate_rc=$VALIDATE_RC" > validate_exit_code.txt
            set -e

            # keep the step exit code 0 so artifact upload always runs (fail at final step instead)
            exit 0

      - name: Upload screenshot artifacts (preview, captured, diffs, test-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-artifacts
          path: |
            app/build/outputs/screenshotTest-results/**
            app/build/intermediates/preview/**
            app/build/test-results/validateDebugScreenshotTest/**
            app/src/debug/screenshotTest/reference/**

      - name: Upload Failing Test Report Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            app/emulator.log
            app/build/outputs/androidTest-results/connected/** || true

      - name: Upload build outputs (APKs / AABs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            ./app/build/outputs/**/*.apk
            ./app/build/outputs/**/*.aab

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ./app/build/reports

      - name: Fail job if screenshot validation failed
        if: always()
        run: |
          if [ -f validate_exit_code.txt ]; then
            rc_line=$(cat validate_exit_code.txt || true)
            rc=${rc_line#validate_rc=}
            echo "Screenshot validation exit code: ${rc}"
            if [ "${rc}" != "0" ] && [ "${rc}" != "" ]; then
              echo "Screenshot validation FAILED. Download 'screenshot-artifacts' from the run to inspect preview/captured/diffs and test-results."
              exit 1
            else
              echo "Screenshot validation succeeded (exit code ${rc})."
            fi
          else
            echo "No validation exit code recorded — assuming success."
          fi
