name: Android CI — Screenshot Testing

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:  # allows manual trigger

jobs:
  validate:
    name: Validate Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Check for baselines in the actual reference path used by your plugin
      - name: Check for screenshot baselines
        id: baseline_check
        run: |
          SNAPSHOT_DIR="app/src/debug/screenshotTest/reference"
          if [ -d "$SNAPSHOT_DIR" ] && [ "$(ls -A "$SNAPSHOT_DIR")" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Baselines found in $SNAPSHOT_DIR"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No screenshot baselines found in $SNAPSHOT_DIR"
          fi

      - name: Run screenshot validation
        if: steps.baseline_check.outputs.found == 'true'
        run: |
          ./gradlew --stop || true
          ./gradlew :app:validateDebugScreenshotTest --stacktrace

      - name: Skip screenshot validation (no baselines)
        if: steps.baseline_check.outputs.found == 'false'
        run: |
          echo "⚠️ No screenshot baselines present. Skipping validateDebugScreenshotTest."
          echo "To create baselines run locally: ./gradlew :app:updateDebugScreenshotTest"
          echo "Commit files from app/src/debug/screenshotTest/reference/ to the repo (or use the record job to generate them)."

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-results
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            build/reports/problems/problems-report.html

      - name: Fail if diffs exist
        if: always() && steps.baseline_check.outputs.found == 'true'
        run: |
          DIFF_DIR="app/build/outputs/screenshotTest-results/preview/debug/diffs"
          if [ -d "$DIFF_DIR" ] && [ "$(ls -A "$DIFF_DIR")" ]; then
            echo "::error file=screenshot_test::Screenshot diffs found in $DIFF_DIR"
            exit 1
          else
            echo "✅ No screenshot diffs found."
          fi

  record:
    name: Record Screenshot Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Record screenshot baselines
        run: |
          ./gradlew --stop || true
          ./gradlew :app:updateDebugScreenshotTest --stacktrace

      - name: Upload new baselines
        uses: actions/upload-artifact@v4
        with:
          name: new-baselines
          path: app/src/debug/screenshotTest/reference/
