name: Android CI - validate screenshots (force Java 17)

on: [push, pull_request]

jobs:
  validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expose Java info
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "java -version: $(java -version 2>&1 | head -n 1)"

      - name: Ensure gradlew executable
        run: chmod +x ./gradlew

      # Make Gradle and its workers use the same Java 17 installation:
      # Write a runtime gradle.properties that sets org.gradle.java.home to the action-provided JAVA_HOME.
      - name: Force Gradle to use Java 17 for workers
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" > "$GITHUB_WORKSPACE/gradle.properties.runtime"
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" >> "$GITHUB_WORKSPACE/gradle.properties.runtime"
        shell: bash

      - name: Start emulator and run validateDebugScreenshotTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          profile: 'Nexus 6'
          force-avd-creation: true
          arch: x86_64
          emulator-options: -wipe-data -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            set -eu

            # make sure the gradle.properties.runtime is used by Gradle calls by passing -Dorg.gradle.project.user.props
            # But easiest: pass -Dorg.gradle.java.home when invoking gradlew so all Gradle processes use Java 17.
            echo "Using JAVA_HOME=$JAVA_HOME"
            ./gradlew --no-daemon --stop || true

            # Optional: assemble/install if your validation requires the APK on device
            # ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --info --stacktrace
            # ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:installDebug || true
            # ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:installDebugAndroidTest || true

            # Run the validation task (force Gradle worker JVMs to use the same Java 17)
            ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:validateDebugScreenshotTest --no-daemon --info --stacktrace || true

            echo "-- Listing outputs for artifact collection --"
            ls -la app/build/outputs/screenshotTest-results || true
            ls -la app/build/test-results/validateDebugScreenshotTest || true
            if [ -f app/build/outputs/screenshotTest-results/preview/debug/results.json ]; then
              echo "==== results.json ===="
              cat app/build/outputs/screenshotTest-results/preview/debug/results.json || true
            fi

      - name: Upload screenshot test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshotTest-results
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            build/reports/problems/problems-report.html

      - name: Terminate emulator (best-effort)
        if: always()
        run: adb -s emulator-5554 emu kill || true
