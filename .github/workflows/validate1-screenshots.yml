name: Android CI — Screenshot Testing

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Cache Gradle + wrapper; invalidate the cache when libs.versions.toml changes
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          target: default
          build-tools: 33.0.2

      # (Optional) Remove previously cached Kotlin stdlib artifacts — useful for first run after version bump
      - name: Remove Kotlin stdlib cache (optional)
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin || true

      # Determine whether baseline screenshots are present in the repo
      - name: Check for screenshot baselines
        id: baseline_check
        run: |
          SNAPSHOT_DIR="app/src/main/screenshotTest/baseline"
          if [ -d "$SNAPSHOT_DIR" ] && [ "$(ls -A "$SNAPSHOT_DIR")" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # Run screenshot validation when baselines are present; refresh dependencies to pick up updated Kotlin stdlib/plugin
      - name: Run screenshot validation
        if: steps.baseline_check.outputs.found == 'true'
        run: |
          ./gradlew :app:validateDebugScreenshotTest --stacktrace --refresh-dependencies

      # If no baselines exist, fail early with guidance (original workflows sometimes updated instead)
      - name: Fail due to missing baselines
        if: steps.baseline_check.outputs.found == 'false'
        run: |
          echo "Baseline screenshots not found in app/src/main/screenshotTest/baseline"
          echo "Generate them locally with: ./gradlew :app:updateDebugScreenshotTest"
          exit 1

      # Upload screenshot renders, diffs and test results so they can be inspected on failure or success
      - name: Upload screenshot artifacts (renders, diffs, test results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-results
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            build/reports/problems/problems-report.html

      # Fail the job if any diffs were produced by the validation run
      - name: Fail if diffs exist
        if: always() && steps.baseline_check.outputs.found == 'true'
        run: |
          DIFF_DIR="app/build/outputs/screenshotTest-results/preview/debug/diffs"
          if [ -d "$DIFF_DIR" ] && [ "$(ls -A "$DIFF_DIR")" ]; then
            echo "::error file=screenshot_test::Screenshot diffs found in $DIFF_DIR"
            echo "Download the 'screenshot-results' artifact from the failing workflow to inspect diffs and renderings."
            exit 1
          else
            echo "✅ No screenshot diffs found."
          fi
