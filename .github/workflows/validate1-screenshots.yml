name: Validate Compose Screenshot Tests

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/**'
  push:
    branches:
      ["*"]

jobs:
  validate-screenshot-tests:
    name: Validate Screenshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🛠 Make Gradle Executable
        run: chmod +x ./gradlew

      - name: 📦 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🧪 Validate Screenshot Tests
        run: |
          ./gradlew --stop
          ./gradlew :app:validateDebugScreenshotTest --stacktrace --no-daemon
          echo "If this fails due to diffs, update your baselines."

      - name: 📤 Upload Screenshot Diffs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/outputs/screenshotTest-results/preview/debug/diffs
