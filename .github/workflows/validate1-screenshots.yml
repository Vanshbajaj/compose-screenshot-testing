name: Android CI - validate screenshot test (single task)

on: [push, pull_request]

jobs:
  validate-screenshots-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure gradlew executable
        run: chmod +x ./gradlew

      - name: Start emulator and run validateDebugScreenshotTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          profile: 'Nexus 6'
          emulator-options: '-no-snapshot -no-audio -no-window -no-boot-anim -no-metrics -gpu swiftshader_indirect'
          script: |
            set -e
            ./gradlew --no-daemon --stop || true

            echo "🧪 Running screenshot test validation..."
            ./gradlew :app:validateDebugScreenshotTest --no-daemon --info --stacktrace

            echo "📁 Listing screenshot test results directory..."
            ls -la app/build/outputs/screenshotTest-results || true
            ls -la app/build/outputs/screenshotTest-results/preview/debug/diffs || true

            echo "🔍 Checking for screenshot diffs..."
            if [ -d "app/build/outputs/screenshotTest-results/preview/debug/diffs" ] && [ "$(ls -A app/build/outputs/screenshotTest-results/preview/debug/diffs)" ]; then
              echo "::error file=screenshot_test::Screenshot diffs found. Please review the uploaded artifacts."
              exit 1
            else
              echo "✅ No screenshot diffs found."
            fi

      - name: Upload screenshot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshotTest-results
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            build/reports/problems/problems-report.html

      - name: Terminate emulator (best-effort)
        if: always()
        run: adb -s emulator-5554 emu kill || true
