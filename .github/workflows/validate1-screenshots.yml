name: Android CI - Validate Screenshots (video capture & full artifacts) - Fixed

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Print java info
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Start emulator, record video, run validate (generate baselines if missing)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          profile: Nexus 6
          force-avd-creation: true
          arch: x86_64
          emulator-options: -wipe-data -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            set -eu
            echo "Using JAVA_HOME=$JAVA_HOME"
            ./gradlew --no-daemon --stop || true

            # Wait for adb device/emulator
            echo "Waiting for emulator device..."
            adb wait-for-device

            # Wait for the device to signal boot completion (timeout
