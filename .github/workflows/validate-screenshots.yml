name: Android CI - validate screenshot test

on: [push, pull_request]

jobs:
  build-and-validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Android Emulator, install app, and validate screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          profile: 'Nexus 6'
          emulator-options: '-no-snapshot -no-audio -no-window -no-boot-anim -no-metrics -gpu swiftshader_indirect'
          script: |
            set -eu

            echo "JAVA: $(java -version 2>&1 | head -n 1)"

            # Stop any stale daemons (best-effort)
            ./gradlew --no-daemon --stop || true

            # Wait for adb/emulator to be ready
            adb wait-for-device
            for i in $(seq 1 30); do
              boot=$(adb -s emulator-5554 shell getprop sys.boot_completed || echo "")
              if [ "$boot" = "1" ]; then
                echo "Emulator fully booted."
                break
              fi
              echo "Waiting for emulator boot ($i/30)..."
              sleep 2
            done

            # Disable animations to speed up tests
            echo "Disabling animations."
            adb -s emulator-5554 shell input keyevent 82
            adb -s emulator-5554 shell settings put global window_animation_scale 0.0
            adb -s emulator-5554 shell settings put global transition_animation_scale 0.0
            adb -s emulator-5554 shell settings put global animator_duration_scale 0.0

            # Build and install debug & test apks
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --info --stacktrace

            # Install debug and test APKs onto emulator
            ./gradlew :app:installDebug || true
            ./gradlew :app:installDebugAndroidTest || true

            # Run the screenshot validation task
            ./gradlew :app:validateDebugScreenshotTest --no-daemon --info --stacktrace || true

            echo "-- Listing outputs for artifact collection --"
            ls -la build/reports/problems || true
            ls -la app/build/test-results/validateDebugScreenshotTest || true
            ls -la app/build/outputs/screenshotTest-results || true
            if [ -f app/build/outputs/screenshotTest-results/preview/debug/results.json ]; then
              echo "==== results.json ===="
              cat app/build/outputs/screenshotTest-results/preview/debug/results.json || true
            fi

      - name: Upload problems report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problems-report
          path: build/reports/problems/

      - name: Upload test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-results-xml
          path: app/build/test-results/validateDebugScreenshotTest/

      - name: Upload screenshot test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshotTest-results
          path: |
            app/build/outputs/screenshotTest-results
            app/src/debug/screenshotTest/reference

      - name: Terminate emulator (best-effort)
        if: always()
        run: |
          adb -s emulator-5554 emu kill || true
