name: Android CI - validate screenshot test

on: [push, pull_request]

jobs:
  build-and-validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Android Emulator and validate screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          profile: 'Nexus 6'
          emulator-options: '-no-snapshot -no-audio -no-window'
          script: |
            # make sure any existing daemon is stopped
            ./gradlew --no-daemon --stop || true

            # run the specific screenshot validation task
            ./gradlew :app:validateDebugScreenshotTest --no-daemon --stacktrace

      - name: Upload test results (reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/outputs/

      - name: Upload screenshot artifacts (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            app/build/outputs/screenshots
            app/build/outputs/screenshotTest
