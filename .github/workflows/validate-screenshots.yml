name: Android CI - validate screenshot test (single task)

on: [push, pull_request]

jobs:
  validate-screenshots-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure gradlew executable
        run: chmod +x ./gradlew

      - name: Start emulator and run only validateDebugScreenshotTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          profile: 'Nexus 6'
          emulator-options: '-no-snapshot -no-audio -no-window -no-boot-anim -no-metrics -gpu swiftshader_indirect'
          script: |
            # POSIX-safe; reactivecircus waits for boot for us
            set -eu

            echo "JAVA: $(java -version 2>&1 | head -n 1)"

            # stop stale daemons (best-effort)
            ./gradlew --no-daemon --stop || true

            # run only the user-requested task
            ./gradlew :app:validateDebugScreenshotTest --no-daemon --info --stacktrace

            # list outputs (helpful for debugging)
            ls -la app/build/outputs/screenshotTest-results || true
            ls -la app/build/test-results/validateDebugScreenshotTest || true
            ls -la build/reports/problems || true

      - name: Upload screenshot artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-outputs
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            build/reports/problems/problems-report.html
