name: Android CI - validate screenshot test

on: [push, pull_request]

jobs:
  build-and-validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Android Emulator and validate screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          profile: 'Nexus 6'
          emulator-options: '-no-snapshot -no-audio -no-window'
          script: |
            exec bash -l <<'BASH'
            set -euo pipefail
            echo "JAVA: $(java -version 2>&1 | head -n 1)"
            ./gradlew --no-daemon --stop || true
            ./gradlew :app:validateDebugScreenshotTest --no-daemon --info --stacktrace || true

            echo "Listing relevant outputs:"
            ls -la build/reports/problems || true
            ls -la app/build/test-results/validateDebugScreenshotTest || true
            ls -la app/build/reports/tests/validateDebugScreenshotTest || true
            ls -la app/build/outputs || true
            BASH


      - name: Upload problems report (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problems-report
          path: build/reports/problems/

      - name: Upload test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-results-xml
          path: app/build/test-results/validateDebugScreenshotTest/

      - name: Upload test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report-html
          path: app/build/reports/tests/validateDebugScreenshotTest/

      - name: Upload screenshot outputs and diffs (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-outputs
          path: |
            app/build/outputs/
            app/build/compose-screenshots || true
