name: Android CI - validate screenshot test

on: [push, pull_request]

jobs:
  build-and-validate-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # increase emulator shutdown wait if necessary
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Android Emulator and validate screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          profile: 'Nexus 6'
          emulator-options: '-no-snapshot -no-audio -no-window -no-boot-anim -no-metrics -gpu swiftshader_indirect'
          # Run everything under bash so `set -o pipefail` is available
          script: |
            bash -lc 'set -euo pipefail
            echo "JAVA: $(java -version 2>&1 | head -n 1)"

            # stop any existing daemons to avoid stale state
            ./gradlew --no-daemon --stop || true

            # run the specific screenshot validation task (keep failures non-fatal here so artifacts are uploaded)
            ./gradlew :app:validateDebugScreenshotTest --no-daemon --info --stacktrace || true

            echo "-- Listing outputs (for artifact upload) --"
            ls -la build/reports/problems || true
            ls -la app/build/test-results/validateDebugScreenshotTest || true
            ls -la app/build/outputs/screenshotTest-results || true
            if [ -f app/build/outputs/screenshotTest-results/preview/debug/results.json ]; then
              echo "==== results.json ===="
              cat app/build/outputs/screenshotTest-results/preview/debug/results.json || true
            fi
            '

      - name: Upload problems report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problems-report
          path: build/reports/problems/

      - name: Upload test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-results-xml
          path: app/build/test-results/validateDebugScreenshotTest/

      - name: Upload screenshot test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshotTest-results
          path: |
            app/build/outputs/screenshotTest-results
            app/build/test-results/validateDebugScreenshotTest
            app/src/debug/screenshotTest/reference

      - name: Terminate emulator early (best-effort)
        if: always()
        run: |
          # best-effort kill of emulator process if still running
          adb devices || true
          adb -s emulator-5554 emu kill || true
